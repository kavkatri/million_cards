{% extends "base.html" %}
{% set page = 'password' %}
{% block title %}Пароль — MillionCards{% endblock %}

{% block content %}
<header>
  <h1>Смена пароля</h1>
  <p class="muted">{{ request.state.user_email }}</p>
</header>

<section class="panel reveal" style="--i: 0; max-width: 26rem">
  {% if message %}
    <p class="{{ 'readout' if ok else 'notice' }}" role="status"
       {% if ok %}data-tone="ok"{% endif %}>{{ message }}</p>
  {% endif %}

  <form method="post" action="/password">
    <label for="current">Текущий пароль
      <input id="current" type="password" name="current" required autocomplete="current-password">
    </label>
    <label for="new">Новый пароль
      <input id="new" type="password" name="new" required minlength="10"
             autocomplete="new-password">
      <small>Не короче 10 символов.</small>
    </label>
    <label for="confirm">Ещё раз
      <input id="confirm" type="password" name="confirm" required minlength="10"
             autocomplete="new-password">
    </label>
    <div class="actions">
      <button type="submit" class="primary">Сменить пароль</button>
    </div>
  </form>
</section>
{% endblock %}
