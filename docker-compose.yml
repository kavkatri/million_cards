name: million-cards

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-million}
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?required - set in .env locally or in your platform environment settings}'
      POSTGRES_DB: ${POSTGRES_DB:-million_cards}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d matters. Without it Postgres defaults the database name to the user
      # name, so the probe opened a database called "million" that does not
      # exist and logged FATAL every interval. pg_isready still reported the
      # server as up -- it had answered, after all -- so the check passed while
      # filling the log with errors that looked like a broken deployment.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-million} -d ${POSTGRES_DB:-million_cards}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &appenv
      # Guarded here too, not just on `db`. Left unguarded, an unset password
      # interpolated to a blank string and the app failed later with an
      # authentication error rather than here with a useful one.
      DATABASE_URL: 'postgresql+asyncpg://${POSTGRES_USER:-million}:${POSTGRES_PASSWORD:?required - set in .env locally or in your platform environment settings}@db:5432/${POSTGRES_DB:-million_cards}'
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: '${SECRET_KEY:?required - see DEPLOY.md for how to generate it}'
      TOKEN_ENCRYPTION_KEY: '${TOKEN_ENCRYPTION_KEY:?required - see DEPLOY.md for how to generate it}'
      MEDIA_ROOT: /data/media
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # First-run login, for platforms with no shell into the container. Used
      # only while the user table is empty; ignored on every boot after that.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - media:/data/media
    # Reachable as `web:8000` from anything on this compose network, which is
    # how a platform's reverse proxy will find it.
    expose:
      - "8000"
    # Published on the host for local use. A managed platform routes over the
    # network instead, so set WEB_BIND=0.0.0.0 only if you really want the port
    # on the host, or delete this block and let the platform handle ingress.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker.runner"]
    environment:
      <<: *appenv
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
    volumes:
      - media:/data/media
    # The image's HEALTHCHECK probes /healthz, which only the web service
    # serves. Left enabled, every worker would report unhealthy forever.
    healthcheck:
      disable: true
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      web: {condition: service_started}
    # Scale freely: `docker compose up -d --scale worker=4`.
    # Throughput is bounded by the per-account token buckets in Redis, never by
    # the number of workers, so adding workers cannot breach a marketplace limit.
    restart: unless-stopped

  scheduler:
    build: .
    command: ["python", "-m", "app.worker.scheduler"]
    environment: *appenv
    healthcheck:
      disable: true
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  media:
